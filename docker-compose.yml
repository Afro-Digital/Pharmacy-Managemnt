version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: tilexpharmacy-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: tilexadmin
      POSTGRES_PASSWORD: tilexpass123
      POSTGRES_DB: tilexpharmacy
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
